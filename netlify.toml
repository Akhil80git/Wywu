[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/shorts"
  to = "/.netlify/functions/shorts"
  status = 200
  force = true

[[redirects]]
  from = "/api/suggest"
  to = "/.netlify/functions/suggest"
  status = 200
  force = true

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
